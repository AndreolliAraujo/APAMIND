name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências pelo lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (zero avisos)
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes
        run: npm run test

      - name: Build de produção
        run: npm run build

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev
